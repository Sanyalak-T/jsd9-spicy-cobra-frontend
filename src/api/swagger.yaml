components:
  schemas:
    Product:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        title:
          type: string
          maxLength: 255
          example: "Abyssal Blood"
        description:
          type: string
          maxLength: 255
        genre_id:
          $ref: "#/components/schemas/Genre"
        release_date:
          type: string
          format: date
        developer:
          type: string
          maxLength: 255
        developer_avatar:
          type: string
          maxLength: 255
        publisher:
          type: string
          maxLength: 255
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
        price:
          type: number
          format: float
        discount_percentage:
          type: integer
          minimum: 0
          maximum: 100
    Genre:
      type: object
      properties:
        genre_id:
          type: string
          format: uuid
        genre_name:
          type: string
          maxLength: 100
        description:
          type: string
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 255
        hash_password:
          type: string
          maxLength: 255
        birthday:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        role:
          type: string
          enum:
            - user
            - dev
            - admin
        status:
          type: boolean
        first_name:
          type: string
        last_name:
          type: string
        address:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 2
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country:
          type: string
    OrderDetails:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        user_id:
          $ref: "#/components/schemas/User" # อ้างอิงไปยัง User schema
        quantity:
          type: integer
        total_price:
          type: number
          format: float
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
        payment_method:
          type: string
          enum:
            - credit_card
            - qrcode
        transaction_date:
          type: string
          format: date-time
        create_at:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        order_line_id:
          type: string
          format: uuid
        order_id:
          $ref: "#/components/schemas/OrderDetails"
        product_id:
          $ref: "#/components/schemas/Product"
        sell_price:
          type: number
          format: float
    Review:
      type: object
      properties:
        review_id:
          type: string
          format: uuid
        user_id:
          $ref: "#/components/schemas/User"
        product_id:
          $ref: "#/components/schemas/Product"
        rating:
          type: integer
          minimum: 0
          maximum: 5
        comment:
          type: string
          maxLength: 255
        review_date:
          type: string
          format: date-time
