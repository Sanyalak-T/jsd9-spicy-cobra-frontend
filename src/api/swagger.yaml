openapi: 3.0.0
info:
  title: MockAPI Service
  version: v1
  description: API documentation for the MockAPI service.

servers:
  - url: https://67f9c3e6094de2fe6ea25531.mockapi.io/api/v1

tags:
  - name: products
    description: Collection of games
  - name: genres
    description: Tags for game category
  - name: orders
    description: Access to store orders
  - name: order-items
    description: Find out more about orders
  - name: users
    description: Operations about user

paths:
  /products:
    get:
      tags:
        - products
      summary: Get all products
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags:
        - products
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request payload
  /products/{id}:
    get:
      tags:
        - products
      summary: Get a product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the product to retrieve
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    put:
      tags:
        - products
      summary: Update a product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the product to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request payload
        "404":
          description: Product not found
    delete:
      tags:
        - products
      summary: Delete a product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the product to delete
      responses:
        "204":
          description: Product deleted successfully (no content)
        "404":
          description: Product not found

